name: AI-G1 residue router

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy pillow pytest
      - run: python -m pytest -q tests/test_ai_gate1.py
      - name: Analyse uploaded AI-G0 images
        run: python ai_gate1_residue_router.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gate1-summary
          path: results/ai_gate1_summary.json
